services:
  - type: web
    name: imeb3-ai-agent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_BASE_URL
        value: https://copa.codyssey.kr/v1
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "500"
