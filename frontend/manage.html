<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iMEB3 AI Agent · Data</title><style>
body{font-family:Arial,"Noto Sans KR",sans-serif;margin:0;background:#f2f4f6;color:#17202a}main{max-width:1180px;margin:auto;padding:24px}nav{display:flex;justify-content:space-between;align-items:center}a{color:#1267c4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #dde2e7;border-radius:12px;padding:16px;margin:14px 0}input,select,button{padding:9px;border:1px solid #ccd3da;border-radius:7px}button{cursor:pointer;background:#17202a;color:#fff}.row{display:flex;gap:7px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:#f6f8fa;padding:10px;border-radius:8px}.stat b{display:block;font-size:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e5e8eb;text-align:left}.scroll{max-height:360px;overflow:auto}.conv{padding:9px;border-bottom:1px solid #eee;cursor:pointer}.messages{white-space:pre-wrap;font-size:12px;background:#f8fafb;padding:12px;border-radius:8px;min-height:100px}@media(max-width:800px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}</style></head><body><main>
<nav><div><b>iMEB3 AI Agent · 과제 기능 검증</b><div style="font-size:12px;color:#68737d">Firestore CRUD · Summary · Conversation</div></div><a href="./index.html">← AI Dashboard</a></nav>
<section class="card"><div class="row"><button id="seed">평가용 120건 DATA 생성</button><button id="refresh">새로고침</button><span id="status"></span></div></section>
<section class="card"><h3>데이터 요약</h3><div id="summary" class="summary"></div></section>
<div class="grid"><section class="card"><h3>데이터 CRUD</h3><form id="form" class="row"><input id="date" type="date" required><input id="value" type="number" step="any" placeholder="value (빈칸=BLANK)"><input id="memo" placeholder="memo"><select id="variant"><option>IV</option><option>OV</option><option>HSV</option></select><button>추가</button></form><div class="scroll"><table><thead><tr><th>date</th><th>variant</th><th>value</th><th>memo</th><th></th></tr></thead><tbody id="data"></tbody></table></div></section>
<section class="card"><h3>대화 기록</h3><div class="grid"><div id="convs" class="scroll"></div><div id="messages" class="messages">대화를 선택하세요.</div></div></section></div>
<script src="./config.js"></script><script>
const A=(window.API_BASE_URL||'http://127.0.0.1:8000').replace(/\/$/,''); const $=s=>document.querySelector(s); async function j(url,opt){let r=await fetch(A+url,opt);if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){
  try{
    let [s,d,c]=await Promise.all([j('/api/data/summary'),j('/api/data'),j('/api/conversations')]);
    $('#summary').innerHTML=`<div class=stat>기간<b>${s.period}</b></div><div class=stat>생산량 기록 / 전체<b>${s.count} / ${s.total_records}</b></div><div class=stat>평균<b>${s.metrics.average?.toFixed?.(1)??'-'}</b></div><div class=stat>최대<b>${s.metrics.max??'-'}</b></div><div class=stat>추세<b>${s.trend}</b></div>`;

    const dataBody=$('#data'); dataBody.replaceChildren();
    d.slice().reverse().slice(0,100).forEach(x=>{
      const tr=document.createElement('tr');
      [x.date||'',x.variant||'',x.value??'BLANK',x.memo||''].forEach(value=>{const td=document.createElement('td');td.textContent=String(value);tr.append(td)});
      const actions=document.createElement('td');
      const edit=document.createElement('button');edit.textContent='수정';edit.onclick=()=>editData(x.id,x.value??null,x.memo||'');
      const remove=document.createElement('button');remove.textContent='삭제';remove.onclick=()=>delData(x.id);
      actions.append(edit,document.createTextNode(' '),remove);tr.append(actions);dataBody.append(tr);
    });

    const convs=$('#convs'); convs.replaceChildren();
    if(!c.length) convs.textContent='저장된 대화 없음';
    c.forEach(x=>{
      const item=document.createElement('div');item.className='conv';
      const open=document.createElement('div');open.style.cursor='pointer';open.onclick=()=>openConv(x.id);
      const title=document.createElement('b');title.textContent=x.title||'대화';
      const updated=document.createElement('small');updated.textContent=x.updated_at||'';
      open.append(title,document.createElement('br'),updated);
      const remove=document.createElement('button');remove.textContent='삭제';remove.style.marginTop='6px';remove.onclick=()=>delConv(x.id);
      item.append(open,remove);convs.append(item);
    });
    $('#status').textContent='Backend 연결됨';
  }catch(e){$('#status').textContent='오류: '+e.message}
}
async function editData(id,currentValue,currentMemo){
  const value=prompt('수정할 value를 입력하세요. 빈칸은 BLANK입니다.',currentValue==null||currentValue==='null'?'':currentValue);
  if(value===null)return;

  const memo=prompt('수정할 memo를 입력하세요.',currentMemo);
  if(memo===null)return;

  await j('/api/data/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      value:value.trim()===''?null:Number(value),
      memo:memo
    })
  });

  load();
}
async function delData(id){await j('/api/data/'+id,{method:'DELETE'});load()}
async function delConv(id){
  if(!confirm('이 대화를 삭제할까요?')) return;

  await j('/api/conversations/'+id,{
    method:'DELETE'
  });

  $('#messages').textContent='대화를 선택하세요.';
  load();
}

async function openConv(id){let c=await j('/api/conversations/'+id);$('#messages').textContent=(c.messages||[]).map(m=>`${m.role}: ${m.content}`).join('\n\n')}
$('#form').onsubmit=async e=>{e.preventDefault();await j('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:$('#date').value,value:$('#value').value===''?null:Number($('#value').value),memo:$('#memo').value,variant:$('#variant').value,metric:'PRODUCTION_QTY',unit:'EA'})});e.target.reset();load()};$('#seed').onclick=async()=>{let o=await j('/api/data/seed-demo',{method:'POST'});$('#status').textContent=o.notice+' / 총 '+o.total+'건';load()};$('#refresh').onclick=load;load();
</script></main></body></html>
